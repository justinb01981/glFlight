apply plugin: 'com.android.application'

android {
    compileSdk 36
    defaultConfig {
        applicationId "com.domain17.glflight"

        ndk {
            moduleName "glFlight"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.debug
        }
        debug {
            jniDebuggable true
        }
    }
    defaultConfig {
        targetSdk 36
        minSdk 21
        versionCode 1180000
        versionName '1.18.0'
        sourceSets.main {
            jniLibs.srcDir 'src/main/libs'
            jni.srcDirs = []
        }
    }
    productFlavors {
    }
    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    ndkVersion '29.0.14206865'
    compileOptions {
        targetCompatibility JavaVersion.VERSION_11
        sourceCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.domain17.glflight'
    buildToolsVersion '36.1.0'
}

// copy {
//    from '../../../../Classes'
//    into 'src/main/jni/game/'
//    include '*.*'
//}

copy {
    from '../../../../'
    into 'src/main/res/raw/'
    include '*.bmp'
    include '*.wav'
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
}
